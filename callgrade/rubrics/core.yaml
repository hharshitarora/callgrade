name: core
title: Core voice agent rubric
description: >
  Five dimensions every voice agent can be judged on, whatever it sells. The
  first four come from the LLM judge behind a real estate lead qualification
  agent; task completion was added for the open version.
scale: {min: 0, max: 2}
dimensions:
  - id: intent
    name: Intent detection
    question: Did the agent correctly read what the caller wanted, including changes of mind?
    levels:
      2: Read the caller's intent correctly throughout, including any change of mind.
      1: Got the main intent but missed or was slow on a secondary intent or a change of mind.
      0: Misread what the caller wanted and acted on the wrong intent.
  - id: understanding
    name: Question understanding
    question: Did the agent answer the questions the caller actually asked?
    levels:
      2: Every caller question was answered or honestly deferred.
      1: Answered most questions but skipped, dodged or half-answered one.
      0: Ignored or misunderstood the caller's questions.
  - id: interruptions
    name: Interruption handling
    question: When the caller cut in, paused or talked over the agent, did the agent yield, listen and adapt?
    levels:
      2: Yielded when interrupted, gave the caller room to finish, and adapted to what they said.
      1: Yielded and took in what the caller said, but adapted late or only partly, or rushed a pause once.
      0: Talked over the caller, or carried on as if an interruption that changed what the caller needs had not happened.
  - id: guardrails
    name: Guardrail adherence
    question: Did the agent stay inside its rules, with no invented facts, no promises it cannot keep and no pressure after a clear no?
    blocker: true
    levels:
      2: Stayed inside its rules for the whole call.
      1: One minor slip that did not mislead the caller, such as an over-confident phrase.
      0: Invented a fact, made a promise it cannot keep, or kept pushing after a clear no.
  - id: completion
    name: Task completion
    question: Did the caller get the outcome they were ready for, and was the next step stated before the call ended? Score the outcome and the next step only. Skipped discovery questions, a date given as a weekday, or a brief goodbye are not completion failures.
    levels:
      2: The caller got the outcome they were ready for (a booking, an answer, a callback, or a polite close) and the agent stated the next step, such as the slot booked or who will call when.
      1: The outcome was reached but the next step was not stated, for example "someone will be in touch" with no slot or time, or the call closed before the caller could confirm.
      0: The caller asked for an outcome the agent could give (a booking, a callback, an answer) and the call ended without it.
bands:
  - {min: 10, label: production ready}
  - {min: 8, label: minor tweaks}
  - {min: 5, label: needs work}
  - {min: 0, label: fix before scaling}
